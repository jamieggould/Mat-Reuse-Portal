<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Material Reuse Group — live impact</title>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:transparent;font-family:Inter,Helvetica,Arial,sans-serif;color:#06183F}
  .wrap{display:flex;gap:12px;flex-wrap:wrap;padding:6px}
  .stat{flex:1 1 160px;background:#06183F;color:#fff;border-radius:10px;padding:16px 18px;position:relative;overflow:hidden;min-width:150px}
  .stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#9EFF51}
  .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9EFF51;font-weight:600}
  .big{font-family:Geologica,Inter,sans-serif;font-size:30px;font-weight:700;line-height:1.15;margin:6px 0 2px}
  .sub{font-size:11px;color:#B9C6E4}
  .foot{font-size:10px;color:#5E6B85;padding:2px 8px}
  .foot a{color:#1653F3;text-decoration:none}
</style></head>
<body>
<div class="wrap" id="w">
  <div class="stat"><div class="lbl">CO₂e avoided</div><div class="big" id="kg">—</div><div class="sub">by reusing instead of buying new</div></div>
  <div class="stat"><div class="lbl">Diverted from waste</div><div class="big" id="t">—</div><div class="sub">tonnes of materials given a second life</div></div>
  <div class="stat"><div class="lbl">Items rehomed</div><div class="big" id="n">—</div><div class="sub">each with a digital material passport</div></div>
</div>
<div class="foot">Live from the <a href="https://www.material-reuse.co.uk" target="_blank" rel="noopener">Material Reuse Group</a> impact ledger</div>
<script>
  (async () => {
    try {
      const d = await (await fetch(location.origin + '/api/public/impact')).json();
      const f = (n) => Number(n || 0).toLocaleString('en-GB');
      document.getElementById('kg').textContent = d.kgCO2e >= 1000 ? (d.kgCO2e / 1000).toFixed(1) + ' t' : f(d.kgCO2e) + ' kg';
      document.getElementById('t').textContent = f(d.tonnesDiverted) + ' t';
      document.getElementById('n').textContent = f(d.itemsRehomed);
    } catch (e) {}
  })();
</script>
</body></html>
