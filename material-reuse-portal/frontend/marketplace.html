<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketplace — Material Reuse Group</title>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#06183F;--azul:#1653F3;--green:#9EFF51;--line:#DDE2EC;--muted:#5E6B85;--r:8px}
  *{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Inter,Helvetica,Arial,sans-serif;color:var(--navy)}
  .wrap{padding:8px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .bar input,.bar select{padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;background:#fff}
  .bar input{flex:1;min-width:200px}
  .count{font-size:12px;color:var(--muted);margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
  .photo{position:relative;aspect-ratio:4/3;background:#EDF1F8;display:flex;align-items:center;justify-content:center;font-family:Geologica,Inter,sans-serif;font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
  .ref{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  h4{margin:0;font-family:Geologica,Inter,sans-serif;font-size:14.5px;line-height:1.3}
  .meta{font-size:12px;color:var(--muted)}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
  .co2{font-size:12px;color:#1D7A05;font-weight:600}.price{font-family:Geologica,Inter,sans-serif;font-weight:700;font-size:15px}.price span{font-size:11px;font-weight:400;color:var(--muted)}
  .btns{display:flex;gap:6px;margin-top:10px}
  .btn{flex:1;text-align:center;text-decoration:none;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:10px 8px;border-radius:6px;border:1px solid var(--azul);color:var(--azul);background:#fff}
  .btn.primary{background:var(--azul);color:#fff}
  .btn.link{border-color:var(--line);color:var(--navy)}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}
  .note{font-size:11px;color:var(--muted);margin-top:16px;text-align:center}
  .note a{color:var(--azul)}
</style></head>
<body><div class="wrap">
  <div class="bar"><input id="q" placeholder="Search the warehouse…"><select id="cat"><option value="">All categories</option></select></div>
  <p class="count" id="count">Loading…</p>
  <div class="grid" id="grid"></div>
  <p class="note">Buy pays in full by card. Reserve pays a <span id="dep">50</span>% deposit to hold the item; the balance is invoiced before collection. Every item has a <a href="/" target="_top">digital material passport</a> — sign in or create a free account to see your orders and impact.</p>
</div>
<script>
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const gbp = (n) => '£' + Number(n || 0).toFixed(2);
  let ITEMS = [];
  function render() {
    const q = document.getElementById('q').value.trim().toLowerCase(), cat = document.getElementById('cat').value;
    const list = ITEMS.filter((i) => (!cat || i.category === cat) && (!q || `${i.title} ${i.category} ${i.itemType} ${i.sku}`.toLowerCase().includes(q)));
    document.getElementById('count').textContent = `${list.length} item${list.length === 1 ? '' : 's'} in the warehouse`;
    document.getElementById('grid').innerHTML = list.length ? list.map((i) => `<div class="card">
      <div class="photo">${i.photos[0] ? `<img src="${esc(i.photos[0].url)}" alt="" loading="lazy">` : esc(i.category)}</div>
      <div class="body"><div class="ref">${esc(i.sku)}</div><h4>${esc(i.title)}</h4>
        <div class="meta">${esc(i.category)} · ${i.quantity} ${esc(i.unit)} available${i.condition ? ' · ' + esc(i.condition) : ''}${i.fulfilment === 'Available For Delivery' ? ' · delivery available' : ''}</div>
        <div class="foot"><span class="co2">${(i.carbonSavedKgPerUnit || 0)} kg CO₂e saved each</span><span class="price">${gbp(i.price)} <span>each</span></span></div>
        <div class="btns">${i.buyUrl ? `<a class="btn primary" href="${esc(i.buyUrl)}" target="_top">Buy</a><a class="btn" href="${esc(i.reserveUrl)}" target="_top">Reserve</a>` : '<span class="btn link">Reserved</span>'}<a class="btn link" href="${esc(i.passportUrl)}" target="_blank" rel="noopener" title="Material passport">Passport</a></div>
      </div></div>`).join('') : '<div class="empty">Nothing matches — try another search, or check back soon.</div>';
  }
  (async () => {
    try {
      const d = await (await fetch('/api/public/marketplace')).json();
      ITEMS = d.items; document.getElementById('dep').textContent = d.depositPercent;
      const cats = [...new Set(ITEMS.map((i) => i.category))].sort();
      document.getElementById('cat').innerHTML = '<option value="">All categories</option>' + cats.map((c) => `<option>${esc(c)}</option>`).join('');
      render();
    } catch (e) { document.getElementById('count').textContent = 'The marketplace is taking a moment — please refresh.'; }
  })();
  document.getElementById('q').addEventListener('input', render); document.getElementById('cat').addEventListener('change', render);
</script></body></html>
